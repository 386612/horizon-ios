name: YSM parser tests

on:
  # CI is intentionally held until the YSM feature set is complete.
  workflow_dispatch:
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/horizon-ysm/**'
      - '.github/workflows/ysm-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Test the YSM parser
        run: cargo test --locked -p horizon-ysm
      - name: Test YSM to Horizon model conversion
        run: cargo test --locked -p horizon-client-lib --lib --no-default-features ysm_model::
      - name: Check player model runtime integration
        run: cargo check --locked -p horizon-client --lib --no-default-features
